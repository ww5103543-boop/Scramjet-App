<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Waved</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c8cff'/%3E%3Cpath d='M8 22 24 10l-4 14-4-5-4 3z' fill='white'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #111215;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased
        }

        #l {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 999999;
            background: #111215
        }

        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .78;
            filter: saturate(1.06) contrast(1.04);
            pointer-events: none
        }

        .bg-dim {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10, 12, 18, .38) 0%, rgba(8, 10, 16, .76) 100%);
            pointer-events: none
        }

        #c {
            position: relative;
            z-index: 1;
            width: min(380px, 90vw);
            background: rgba(16, 20, 32, .48);
            backdrop-filter: blur(28px) saturate(185%);
            -webkit-backdrop-filter: blur(28px) saturate(185%);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 16px;
            box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, .32), 0 22px 52px rgba(0, 0, 0, .62);
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start
        }

        .head-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px
        }

        .ring {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            animation: spin .7s linear infinite;
            flex-shrink: 0
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .t {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.01em
        }

        .b {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, .14);
            border-radius: 999px;
            overflow: hidden
        }

        .p {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, .88);
            border-radius: 999px;
            transition: width .1s linear
        }

        .n {
            margin-top: 9px;
            font-size: 12px;
            color: rgba(226, 232, 240, .72);
            font-variant-numeric: tabular-nums
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap
        }

        .act-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            user-select: none
        }

        .act-btn:hover {
            background: rgba(255, 255, 255, .16);
            border-color: rgba(255, 255, 255, .34);
            color: #fff
        }

        .act-btn svg {
            flex-shrink: 0;
            opacity: .85
        }

        a.act-btn {
            text-decoration: none
        }

        .err-only {
            display: none
        }

        .err .ring,
        .err .b {
            display: none
        }

        .err .err-only {
            display: inline-flex
        }
    </style>
</head>

<body id="b">
    <div id="l">
        <img class="bg-img" src="https://waveds.up.railway.app/background.webp?v=5" alt="" aria-hidden="true"
            onerror="this.style.display='none'">
        <div class="bg-dim" aria-hidden="true"></div>
        <div id="c">
            <div class="head-row">
                <div class="ring" aria-hidden="true"></div>
                <div class="t" id="t">Loading Waved</div>
            </div>
            <div class="b">
                <div class="p" id="p"></div>
            </div>
            <div class="n" id="n">Fetching bundle...</div>

            <div class="actions">
                <button type="button" class="act-btn err-only" id="retry">Retry</button>
                <a class="act-btn err-only" id="raw"
                    href="https://github.com/ww5103543-boop/Scramjet-App/blob/main/singlefile.html" target="_blank"
                    rel="noopener">GitHub</a>
                <button type="button" class="act-btn" id="btn-fs" title="Fullscreen">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                    </svg>
                    <span id="btn-fs-text">Fullscreen</span>
                </button>
                <button type="button" class="act-btn" id="btn-cloak" title="Open in about:blank">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                        <polyline points="15 3 21 3 21 9" />
                        <line x1="10" y1="14" x2="21" y2="3" />
                    </svg>
                    <span id="btn-cloak-text">Open about:blank</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const CACHE_KEY = "waved.launcherCache";
            const CACHE_VER_KEY = "waved.launcherVer";
            const BUILD_VER = "b4020fc";
            const IDB_NAME = "waved_launcher_db";
            const IDB_STORE = "cache";
            const CONNECT_TIMEOUT_MS = 4500;
            const STALL_TIMEOUT_MS = 12000;
            const MIN_LEN = 50000;
            const EST_BYTES = 2415417;

            const mirrorWaves = [
                // Wave 1: Fastest jsDelivr global edges + raw GitHub
                [
                    "aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBiNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9mYXN0bHkuanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBiNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9nY29yZS5qc2RlbGl2ci5uZXQvZ2gvd3c1MTAzNTQzLWJvb3AvU2NyYW1qZXQtQXBwQGI0MDIwZmMvc2luZ2xlZmlsZS5odG1s",
                    "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcC9iNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA=="
                ],
                // Wave 2: Secondary jsDelivr CDN edges
                [
                    "aHR0cHM6Ly90ZXN0aW5nY2YuanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBiNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9qc2RlbGl2ci5iLWNkbi5uZXQvZ2gvd3c1MTAzNTQzLWJvb3AvU2NyYW1qZXQtQXBwQGI0MDIwZmMvc2luZ2xlZmlsZS5odG1s",
                    "aHR0cHM6Ly9vcmlnaW5mYXN0bHkuanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBiNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9xdWFudGlsLmpzZGVsaXZyLm5ldC9naC93dzUxMDM1NDMtYm9vcC9TY3JhbWpldC1BcHBAYjQwMjBmYy9zaW5nbGVmaWxlLmh0bWw="
                ],
                // Wave 3: Regional proxies & @main branch fallbacks
                [
                    "aHR0cHM6Ly9jZG4uanNkbWlycm9yLmNuL2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBiNDAyMGZjL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9qc2Qub25taWNyb3NvZnQuY24vZ2gvd3c1MTAzNTQzLWJvb3AvU2NyYW1qZXQtQXBwQGI0MDIwZmMvc2luZ2xlZmlsZS5odG1s",
                    "aHR0cHM6Ly9naHByb3h5Lm5ldC9odHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20vd3c1MTAzNTQzLWJvb3AvU2NyYW1qZXQtQXBwL2I0MDIwZmMvc2luZ2xlZmlsZS5odG1s",
                    "aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBtYWluL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9mYXN0bHkuanNkZWxpdnIubmV0L2doL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcEBtYWluL3NpbmdsZWZpbGUuaHRtbA==",
                    "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3d3NTEwMzU0My1ib29wL1NjcmFtamV0LUFwcC9tYWluL3NpbmdsZWZpbGUuaHRtbA=="
                ]
            ].map(wave => wave.map(x => atob(x)));

            const bodyEl = document.getElementById("b");
            const p = document.getElementById("p");
            const n = document.getElementById("n");
            const t = document.getElementById("t");
            const retryBtn = document.getElementById("retry");
            const btnFs = document.getElementById("btn-fs");
            const btnFsText = document.getElementById("btn-fs-text");
            const btnCloak = document.getElementById("btn-cloak");
            const btnCloakText = document.getElementById("btn-cloak-text");

            const TAB_ICON = "data:image/svg+xml," + encodeURIComponent(
                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>" +
                "<rect width='32' height='32' rx='8' fill='#6c8cff'/>" +
                "<path d='M8 22 24 10l-4 14-4-5-4 3z' fill='white'/></svg>"
            );

            let loadedHtml = null;
            let cloakTargetWin = null;
            let userRequestedCloak = false;
            let busy = false;
            let executed = false;

            const fmt = x => (x / 1048576).toFixed(2) + " MB";

            function isValidLauncherHtml(html) {
                return typeof html === "string" && html.length >= MIN_LEN && html.toLowerCase().indexOf("<html") !== -1;
            }

            function isPinnedUrl(url) {
                return /(@|\/)[0-9a-f]{7,40}\/singlefile\.html$/i.test(url);
            }

            function cacheBustedUrl(base) {
                return base + (base.indexOf("?") === -1 ? "?" : "&") + "v=" + Date.now();
            }

            // Fullscreen toggle handler
            if (btnFs) {
                btnFs.addEventListener("click", () => {
                    if (!document.fullscreenElement) {
                        const el = document.documentElement;
                        if (el.requestFullscreen) el.requestFullscreen().catch(() => { });
                        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                        if (btnFsText) btnFsText.textContent = "Exit Fullscreen";
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        if (btnFsText) btnFsText.textContent = "Fullscreen";
                    }
                });
                document.addEventListener("fullscreenchange", () => {
                    if (btnFsText) {
                        btnFsText.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
                    }
                });
            }

            function stampIdentity(win, title) {
                try {
                    const d = win.document;
                    const hd = d.head || d.getElementsByTagName("head")[0];
                    if (!hd) return;
                    hd.querySelectorAll('link[rel~="icon"]').forEach(el => el.remove());
                    const l = d.createElement("link");
                    l.rel = "icon";
                    l.type = "image/svg+xml";
                    l.href = TAB_ICON;
                    hd.appendChild(l);
                    if (title !== false) d.title = title || "Waved";
                } catch (_) { }
            }

            function splashDoc() {
                return "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
                    "<title>Waved</title><link rel=\"icon\" type=\"image/svg+xml\" href=\"" + TAB_ICON + "\">" +
                    "<style>html,body{margin:0;height:100%;background:#111215;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}" +
                    "body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center}" +
                    ".r{width:18px;height:18px;border-radius:50%;border:2px solid #2e3138;border-top-color:#e5e7eb;animation:s .7s linear infinite}" +
                    "@keyframes s{to{transform:rotate(360deg)}}" +
                    "b{font-size:14px;font-weight:600}p{margin:0;font-size:12px;color:#8b909a}" +
                    "#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111215;opacity:0;transition:opacity .2s ease;z-index:10}" +
                    "#app.in{opacity:1}</style></head><body>" +
                    "<div class=\"r\"></div><b>Preparing Waved...</b><p>Loading into this tab.</p>" +
                    "</body></html>";
            }

            function openBlank() {
                let w = null;
                try { w = window.open("about:blank", "_blank"); } catch (_) { }
                if (!w) { try { w = window.top.open("about:blank", "_blank"); } catch (_) { } }
                if (w) {
                    try {
                        w.document.open();
                        w.document.write(splashDoc());
                        w.document.close();
                        stampIdentity(w, "Waved");
                    } catch (_) { }
                }
                return w;
            }

            // Runtime shims so history APIs and document.URL remain valid under blob/about:blank/srcdoc
            function injectCompat(html) {
                const shim = "<script>(function(){try{" +
                    "var fb=(location.origin&&location.origin!==\"null\"&&/^https?:/i.test(location.origin)?location.origin:\"https://waved.invalid\")+\"/\";" +
                    "if(!/^https?:/i.test(document.URL)){" +
                    "try{Object.defineProperty(document,\"URL\",{configurable:true,get:function(){return fb}});}catch(_){}" +
                    "try{Object.defineProperty(document,\"documentURI\",{configurable:true,get:function(){return fb}});}catch(_){}" +
                    "}" +
                    "var ps=history.pushState,rs=history.replaceState;" +
                    "history.pushState=function(){try{return ps.apply(this,arguments)}catch(_){}};" +
                    "history.replaceState=function(){try{return rs.apply(this,arguments)}catch(_){}};" +
                    "}catch(_){}})();<\/script>";
                let m = html.match(/<head(\s[^>]*)?>/i);
                if (m) return html.slice(0, m.index + m[0].length) + shim + html.slice(m.index + m[0].length);
                m = html.match(/<!doctype[^>]*>/i);
                if (m) return html.slice(0, m.index + m[0].length) + shim + html.slice(m.index + m[0].length);
                return shim + html;
            }

            if (btnCloak) {
                btnCloak.addEventListener("click", () => {
                    userRequestedCloak = true;
                    if (loadedHtml) {
                        const ok = openInAboutBlank(loadedHtml);
                        if (!ok && btnCloakText) btnCloakText.textContent = "Popup blocked — allow popups";
                    } else {
                        if (!cloakTargetWin || cloakTargetWin.closed) {
                            cloakTargetWin = openBlank();
                        }
                        if (!cloakTargetWin) {
                            if (btnCloakText) btnCloakText.textContent = "Popup blocked — allow popups";
                        } else if (btnCloakText) {
                            btnCloakText.textContent = "Opening when ready...";
                        }
                    }
                });
            }

            function openInAboutBlank(html) {
                try {
                    const targetWin = (cloakTargetWin && !cloakTargetWin.closed) ? cloakTargetWin : openBlank();
                    if (!targetWin) return false;
                    const safeHtml = injectCompat(html);
                    try {
                        const f = targetWin.document.createElement("iframe");
                        f.id = "app";
                        f.title = "Waved";
                        f.setAttribute("allow", "fullscreen; clipboard-read; clipboard-write; autoplay; microphone; camera; geolocation; encrypted-media; picture-in-picture");
                        f.setAttribute("allowfullscreen", "");
                        let shown = false;
                        const show = () => { if (!shown) { shown = true; f.classList.add("in"); } };
                        f.addEventListener("load", show);
                        setTimeout(show, 1500);
                        f.srcdoc = safeHtml;
                        targetWin.document.body.appendChild(f);
                        void f.offsetWidth;
                    } catch (_) {
                        targetWin.document.open();
                        targetWin.document.write(safeHtml);
                        targetWin.document.close();
                        stampIdentity(targetWin, "Waved");
                    }
                    if (btnCloakText) btnCloakText.textContent = "Opened in about:blank";
                    return true;
                } catch (err) {
                    console.error("Cloak window write error:", err);
                }
                return false;
            }

            function run(html) {
                if (executed) return;
                executed = true;
                const safeHtml = injectCompat(html);
                const go = () => {
                    try {
                        document.open();
                        document.write(safeHtml);
                        document.close();
                    } catch (_) {
                        document.documentElement.innerHTML = safeHtml;
                        document.querySelectorAll("script").forEach(oldScript => {
                            const newScript = document.createElement("script");
                            if (oldScript.src) newScript.src = oldScript.src;
                            else newScript.textContent = oldScript.textContent;
                            document.body.appendChild(newScript);
                        });
                    }
                };
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", () => setTimeout(go, 0));
                } else {
                    setTimeout(go, 0);
                }
            }

            function launchHtml(html, cloakStatus) {
                loadedHtml = html;
                if (userRequestedCloak && openInAboutBlank(html)) {
                    busy = false;
                    t.textContent = "Launched in about:blank!";
                    n.textContent = cloakStatus || "You can switch to the new tab.";
                    return;
                }
                run(html);
            }

            function openIDB() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject(new Error("no idb"));
                    const req = indexedDB.open(IDB_NAME, 1);
                    req.onupgradeneeded = () => {
                        if (!req.result.objectStoreNames.contains(IDB_STORE)) {
                            req.result.createObjectStore(IDB_STORE);
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async function saveCache(html) {
                let idbSaved = false;
                try {
                    const db = await openIDB();
                    await new Promise((res, rej) => {
                        const tx = db.transaction(IDB_STORE, "readwrite");
                        tx.objectStore(IDB_STORE).put({ ver: BUILD_VER, html }, CACHE_KEY);
                        tx.oncomplete = () => res();
                        tx.onerror = () => rej(tx.error);
                        tx.onabort = () => rej(tx.error || new Error("aborted"));
                    });
                    db.close();
                    idbSaved = true;
                } catch (_) { }
                if (idbSaved) {
                    try {
                        localStorage.removeItem(CACHE_KEY);
                        localStorage.removeItem(CACHE_VER_KEY);
                    } catch (_) { }
                    return;
                }
                try {
                    localStorage.setItem(CACHE_KEY, html);
                    localStorage.setItem(CACHE_VER_KEY, BUILD_VER);
                } catch (_) { }
            }

            async function readCache() {
                try {
                    const db = await openIDB();
                    const c = await new Promise((res, rej) => {
                        const tx = db.transaction(IDB_STORE, "readonly");
                        const req = tx.objectStore(IDB_STORE).get(CACHE_KEY);
                        req.onsuccess = () => res(req.result);
                        req.onerror = () => rej(req.error);
                    });
                    db.close();
                    if (c && typeof c === "object" && isValidLauncherHtml(c.html)) {
                        return { ver: typeof c.ver === "string" ? c.ver : "", html: c.html };
                    }
                    if (isValidLauncherHtml(c)) {
                        return { ver: "", html: c };
                    }
                } catch (_) { }
                try {
                    const c = localStorage.getItem(CACHE_KEY);
                    if (isValidLauncherHtml(c)) {
                        return { ver: localStorage.getItem(CACHE_VER_KEY) || "", html: c };
                    }
                } catch (_) { }
                return null;
            }

            async function fromCache(existingCached) {
                const cached = existingCached || await readCache();
                if (!cached) return false;
                p.style.width = "100%";
                t.textContent = "Loaded from offline cache";
                n.textContent = "100% · " + fmt(cached.html.length);
                launchHtml(cached.html, "Launched cached build in about:blank.");
                busy = false;
                return true;
            }

            function fail() {
                busy = false;
                if (bodyEl) bodyEl.classList.add("err");
                t.textContent = "Couldn't load the launcher";
                n.textContent = "Check your connection and try again. If jsDelivr/GitHub CDNs are blocked on this network, that would explain it.";
                p.style.width = "0%";
            }

            // Race all mirrors in a wave concurrently; abort losers as soon as the fastest healthy response resolves
            function raceWave(urls) {
                return new Promise((resolve, reject) => {
                    let settled = false;
                    let remaining = urls.length;
                    if (!remaining) return reject(new Error("empty wave"));
                    const ctrls = urls.map(() => window.AbortController ? new AbortController() : null);
                    const timers = new Array(urls.length).fill(null);
                    let lastErr = new Error("All mirrors failed");

                    const cleanupAll = keepIdx => {
                        for (let j = 0; j < urls.length; j++) {
                            if (timers[j]) {
                                clearTimeout(timers[j]);
                                timers[j] = null;
                            }
                            if (j !== keepIdx && ctrls[j]) {
                                try { ctrls[j].abort(); } catch (_) { }
                            }
                        }
                    };

                    urls.forEach((url, idx) => {
                        const ctrl = ctrls[idx];
                        const pinned = isPinnedUrl(url);
                        const targetUrl = pinned ? url : cacheBustedUrl(url);
                        const host = (() => { try { return new URL(url).hostname; } catch (_) { return "mirror"; } })();

                        timers[idx] = setTimeout(() => {
                            if (ctrl) { try { ctrl.abort(); } catch (_) { } }
                        }, CONNECT_TIMEOUT_MS);

                        fetch(targetUrl, {
                            cache: pinned ? "force-cache" : "no-store",
                            signal: ctrl ? ctrl.signal : undefined
                        }).then(r => {
                            if (timers[idx]) {
                                clearTimeout(timers[idx]);
                                timers[idx] = null;
                            }
                            if (!r || !r.ok) {
                                if (ctrl && !settled) { try { ctrl.abort(); } catch (_) { } }
                                throw new Error("HTTP " + (r ? r.status : 0));
                            }
                            if (settled) {
                                if (ctrl) { try { ctrl.abort(); } catch (_) { } }
                                if (r.body && r.body.cancel) r.body.cancel().catch(() => { });
                                return;
                            }
                            settled = true;
                            cleanupAll(idx);
                            resolve({ r, ctrl, host });
                        }).catch(err => {
                            if (timers[idx]) {
                                clearTimeout(timers[idx]);
                                timers[idx] = null;
                            }
                            lastErr = err;
                            remaining--;
                            if (!settled && remaining === 0) {
                                reject(lastErr);
                            }
                        });
                    });
                });
            }

            async function readStream(r, ctrl, host) {
                try {
                    if (!r.body || !r.body.getReader) {
                        const txt = await r.text();
                        if (!isValidLauncherHtml(txt)) {
                            throw new Error("Invalid HTML");
                        }
                        p.style.width = "100%";
                        n.textContent = host + " · 100% · " + fmt(txt.length);
                        return txt;
                    }

                    const total = +(r.headers.get("content-length") || 0);
                    const enc = r.headers.get("content-encoding");
                    let trusted = !!total && !enc;
                    const rd = r.body.getReader();
                    const chunks = [];
                    let got = 0;

                    for (; ;) {
                        let stallTimer, q;
                        try {
                            q = await Promise.race([
                                rd.read(),
                                new Promise((_, rej) => {
                                    stallTimer = setTimeout(() => {
                                        if (ctrl) { try { ctrl.abort(); } catch (_) { } }
                                        rej(new Error("stall"));
                                    }, STALL_TIMEOUT_MS);
                                })
                            ]);
                        } finally {
                            clearTimeout(stallTimer);
                        }
                        if (q.done) break;
                        chunks.push(q.value);
                        got += q.value.length;
                        if (trusted && got > total * 1.02) trusted = false;
                        const den = trusted ? total : Math.max(EST_BYTES, got * 1.05);
                        const pc = Math.min(99, (got / den) * 100);
                        p.style.width = pc.toFixed(1) + "%";
                        n.textContent = trusted
                            ? host + " · " + pc.toFixed(0) + "% · " + fmt(got) + " / " + fmt(total)
                            : host + " · " + pc.toFixed(0) + "% · " + fmt(got);
                    }

                    if (got < MIN_LEN) throw new Error("too small");

                    const all = new Uint8Array(got);
                    let o = 0;
                    for (const ch of chunks) {
                        all.set(ch, o);
                        o += ch.length;
                    }

                    const html = new TextDecoder().decode(all);
                    if (!isValidLauncherHtml(html)) {
                        throw new Error("Unexpected response");
                    }

                    p.style.width = "100%";
                    n.textContent = host + " · 100% · " + fmt(got);
                    return html;
                } catch (err) {
                    if (ctrl) { try { ctrl.abort(); } catch (_) { } }
                    throw err;
                }
            }

            async function load() {
                if (busy || executed) return;
                busy = true;
                if (bodyEl) bodyEl.classList.remove("err");
                t.textContent = "Loading Waved...";
                n.textContent = "Checking offline cache...";
                p.style.width = "0%";

                const cached = await readCache();
                if (cached && cached.ver === BUILD_VER) {
                    p.style.width = "100%";
                    t.textContent = "Launching Waved...";
                    n.textContent = "Cached · " + fmt(cached.html.length);
                    launchHtml(cached.html);
                    return;
                }

                if (cached && navigator.onLine === false) {
                    await fromCache(cached);
                    return;
                }

                for (let w = 0; w < mirrorWaves.length; w++) {
                    try {
                        t.textContent = "Loading Waved...";
                        n.textContent = w === 0
                            ? "Racing fastest jsDelivr mirrors..."
                            : "Trying backup mirrors (wave " + (w + 1) + ")...";
                        p.style.width = "0%";

                        const { r, ctrl, host } = await raceWave(mirrorWaves[w]);
                        const html = await readStream(r, ctrl, host);
                        loadedHtml = html;
                        await saveCache(html);
                        launchHtml(html);
                        return;
                    } catch (_) {
                        if (w === 0 && cached && (await fromCache(cached))) {
                            return;
                        }
                        await new Promise(resolve => setTimeout(resolve, 60));
                    }
                }

                if (!(await fromCache(cached))) {
                    fail();
                }
            }

            if (retryBtn) retryBtn.addEventListener("click", load);
            load();
        })();
    </script>
</body>
